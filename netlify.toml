[build]
  command = "npm run build"
  publish = "dist"
  functions = ".netlify/functions-internal"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--include=dev"

# TanStack Start / Nitro SSR
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
